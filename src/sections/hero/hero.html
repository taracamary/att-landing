<section id="hero" class="hero">
  <div class="hero__media" aria-hidden="true">
    <picture class="hero__picture">
      <source type="image/webp" srcset="./assets/images/hero.webp">
      <img class="hero__image" src="./assets/images/hero.jpg" alt="" fetchpriority="high" decoding="async">
    </picture>
  </div>
  <div class="hero__overlay" aria-hidden="true"></div>

  <div class="hero__inner">
    <h1 class="hero__title">
      <span lang="ru">Экскурсия Тысячелетний Брест и Брестская крепость</span>
      <span lang="en">Excursion: Millennium Brest and the Brest Fortress</span>
    </h1>
    <p class="hero__subtitle">
      <span lang="ru">Погрузитесь в историю наследия заповедной памяти</span>
      <span lang="en">Immerse yourself in the history of protected heritage</span>
    </p>
    <div class="hero__actions">
      <a class="button button--primary hero__cta" href="#schedule">
        <span lang="ru">Расписание</span>
        <span lang="en">Schedule</span>
      </a>
      <a class="hero__scroll" href="#schedule" data-aria-label-ru="Прокрутить к расписанию"
        data-aria-label-en="Scroll to schedule" aria-label="Прокрутить к расписанию">
        <span class="hero__chevrons" aria-hidden="true">
          <svg class="hero__chevron" width="24" height="24" focusable="false">
            <use href="/assets/icons/sprite.svg#down"></use>
          </svg>
          <svg class="hero__chevron" width="24" height="24" focusable="false">
            <use href="/assets/icons/sprite.svg#down"></use>
          </svg>
          <svg class="hero__chevron" width="24" height="24" focusable="false">
            <use href="/assets/icons/sprite.svg#down"></use>
          </svg>
        </span>
      </a>
    </div>
  </div>
</section>
